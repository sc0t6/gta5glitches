name: Update data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
    - cron: "20 9-11 * * 4"  # right after the Thursday weekly reset (09:00 UTC)
  workflow_dispatch:         # Actions tab -> "Run workflow"

permissions:
  contents: write   # commit the refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No setup-node step: the runner already has Node 20 (the updater needs 18+),
      # and this project has no dependencies, so there is nothing to install or cache.
      - name: Show Node version
        run: node --version

      # If a source is down the updater keeps the previous values for that part.
      # If it fails outright we still deploy the data that is already in the repo.
      - name: Refresh data from the sources
        run: node updater/update.mjs || echo "::warning::Updater failed, deploying existing data"

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh live data"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Build the site folder
        run: |
          mkdir _site
          cp index.html styles.css app.js data.js cheats.js _site/
          mkdir _site/data
          cp data/live.js data/live.json _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
