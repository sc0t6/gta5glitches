name: Update data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
    - cron: "20 9-11 * * 4"  # right after the Thursday weekly reset (09:00 UTC)
  workflow_dispatch:         # Actions tab -> "Run workflow"

permissions:
  contents: write   # commit the refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No setup-node step: the runner already has Node 20 (the updater needs 18+),
      # and this project has no dependencies, so there is nothing to install or cache.
      - name: Show Node version
        run: node --version

      # Generated data (live.js, live.json, state.json) lives on its own 'data' branch, so it
      # can never conflict with the commits you make to main.
      - name: Load saved data from the data branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then
            git worktree add -B data _databranch FETCH_HEAD
            if [ -d _databranch/data ]; then cp -r _databranch/data/. data/; fi
          else
            echo "No data branch yet, starting fresh"
            git worktree add --detach _databranch
            git -C _databranch checkout --orphan data
            git -C _databranch rm -rf --quiet . || true
          fi

      # If a source is down the updater keeps the previous values for that part.
      # If it fails outright we still deploy the data we already have.
      - name: Refresh data from the sources
        run: node updater/update.mjs || echo "::warning::Updater failed, deploying the data we already have"

      - name: Save data to the data branch
        run: |
          mkdir -p _databranch/data
          for f in live.js live.json state.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_databranch/data/$f"; fi
          done
          cd _databranch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh live data"
            git push origin HEAD:data
          fi

      - name: Build the site folder
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js data.js cheats.js _site/
          cp data/live.js data/live.json _site/data/ || echo "::warning::No live data yet, deploying the built-in copy"
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
